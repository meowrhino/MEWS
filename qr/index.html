<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>hacedor de QR</title>
    <link rel="icon" href="../neko/Awake.ico">
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: #16171c;
            color: #eee;
            font: 15px/1.4 system-ui, sans-serif;
        }
        main { display: grid; gap: 14px; width: min(340px, 100vw - 32px); padding: 24px 0; }
        .card { background: #22232a; border: 1px solid #33343c; border-radius: 14px; padding: 12px; }
        canvas { display: block; width: 100%; image-rendering: pixelated; border-radius: 8px; outline: 3px solid #7d8ef0; outline-offset: 4px; }
        h1 { font-size: 1.2rem; margin: 14px 0 4px; }
        #estado::before { content: '●'; margin-right: 6px; }
        #estado.ok { color: #5fd38d; }
        #estado.mal { color: #ff6b6b; }
        label { display: grid; gap: 4px; font-size: .85rem; color: #aaa; }
        input, select, textarea, button { font: inherit; color: #eee; background: #2c2d35; border: 1px solid #44454e; border-radius: 8px; padding: 8px; }
        textarea { font-family: ui-monospace, monospace; line-height: 1.1; resize: vertical; }
        .fila { display: flex; gap: 10px; }
        .fila > * { flex: 1; }
        input[type=color] { padding: 2px; height: 38px; }
        button { cursor: pointer; }
        small { color: #888; }
    </style>
</head>
<body>
<main>
    <div class="card">
        <canvas id="lienzo"></canvas>
        <h1 id="titulo">Pixel art central</h1>
        <div id="estado"></div>
    </div>

    <label>URL <input id="url"></label>
    <div class="fila">
        <label>Dibujo <select id="dibujo"></select></label>
        <label>Tinta <input id="tinta" type="color" value="#000000"></label>
        <label>Color <input id="color" type="color" value="#e8553b"></label>
    </div>
    <label>Pixel art (edítalo) <textarea id="arte" rows="9" spellcheck="false"></textarea></label>
    <small>. blanco · # tinta · o color · p rosa. Cuanto más grande el dibujo, más fácil que deje de leerse.</small>
    <div class="fila">
        <button id="png" type="button">Descargar PNG</button>
        <button id="svg" type="button">Descargar SVG</button>
    </div>
</main>

<script src="../vendor/qr/qrcode.js"></script>
<script src="../vendor/qr/jsQR.js"></script>
<script src="qr.js"></script>
<script>
    const $ = (id) => document.getElementById(id);
    const PX = 10; // píxeles por módulo en el PNG
    let actual;

    $('url').value = QR_URL;
    $('dibujo').append(...Object.keys(DIBUJOS).map((k) => new Option(k)));
    $('arte').value = DIBUJOS.gato.join('\n');

    function dibujar() {
        const text = $('url').value.trim();
        const arte = $('arte').value.split('\n').filter((r) => r.length);
        try {
            actual = buildQR(qrcode, text, arte, { tinta: $('tinta').value, color: $('color').value });
        } catch (err) {
            $('estado').className = 'mal';
            $('estado').textContent = 'URL demasiado larga';
            return;
        }
        const c = $('lienzo'), ctx = c.getContext('2d');
        c.width = c.height = actual.size * PX;
        actual.cells.forEach((row, y) => row.forEach((col, x) => {
            ctx.fillStyle = col;
            ctx.fillRect(x * PX, y * PX, PX, PX);
        }));
        const ok = seLee(jsQR, actual, text);
        $('estado').className = ok ? 'ok' : 'mal';
        $('estado').textContent = ok ? 'Se lee bien' : 'No se lee: haz el dibujo más pequeño';
    }

    function bajar(href, nombre) {
        const a = document.createElement('a');
        a.href = href;
        a.download = nombre;
        a.click();
    }

    $('dibujo').addEventListener('change', () => {
        $('arte').value = DIBUJOS[$('dibujo').value].join('\n');
        dibujar();
    });
    ['url', 'arte', 'tinta', 'color'].forEach((id) => $(id).addEventListener('input', dibujar));
    $('png').addEventListener('click', () => bajar($('lienzo').toDataURL('image/png'), `qr-${$('dibujo').value}.png`));
    $('svg').addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([toSVG(actual)], { type: 'image/svg+xml' }));
        bajar(url, `qr-${$('dibujo').value}.svg`);
    });
    dibujar();
</script>
</body>
</html>
